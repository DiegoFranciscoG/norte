name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks 8.30.1 (verificado con SHA-256)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Buscar secretos en todo el historial
        run: ./gitleaks git --config .gitleaks.toml --redact --exit-code 1 .

  node:
    name: Núcleo, ingesta y web
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - name: Pruebas del núcleo y la ingesta con cobertura (T-01 a T-04, T-06 a T-08, T-10)
        run: npm run test:coverage
      - name: Índice de demostración para la web (datos ficticios)
        run: npm run ingest:demo
      - run: npm run web:build
      - run: npm run web:test
      - name: Navegador para las pruebas de extremo a extremo
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Pruebas de extremo a extremo (T-05 y flujo global)
        run: npm run e2e
        env:
          CI: 'true'

  api:
    name: API (Java 25, PostgreSQL real con Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compilar, pruebas unitarias, de integración (T-09) y cobertura mínima del 70 %
        run: ./mvnw -B -Pcoverage verify
        working-directory: api
