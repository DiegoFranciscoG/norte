# Sin valores por defecto para secretos: si falta DB_PASSWORD, JWT_SECRET o ALERTS_TRIGGER_TOKEN la API no arranca.
spring:
  application:
    name: norte-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  threads:
    virtual:
      enabled: true

server:
  port: ${APP_PORT:8080}
  # Detrás de un proxy (Render): IP y esquema reales. Tomcat solo los acepta si quien conecta está en una red privada.
  forward-headers-strategy: native
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

logging:
  level:
    # Hibernate copiaría en el log el detalle de PostgreSQL, que incluye valores como el correo.
    org.hibernate.orm.jdbc.error: "OFF"

management:
  # El correo es opcional (solo alertas): si el SMTP falla, la API sigue sana.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

norte:
  jwt:
    secret: ${JWT_SECRET}
    issuer: norte-api
    access-ttl: PT15M
    refresh-ttl: P7D
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS}
  alerts:
    trigger-token: ${ALERTS_TRIGGER_TOKEN}
    from: ${ALERTS_FROM:alertas@norte.local}
    max-jobs-per-email: 10
    lookback-hours-first-run: 72
  index-base-url: ${NORTE_INDEX_BASE_URL}
  site-url: ${NORTE_SITE_URL:http://localhost:4200}
  rate-limit:
    # Por correo protege una cuenta. Por IP es más holgado: una oficina o una universidad comparten IP.
    max-attempts: 5
    max-attempts-per-ip: 20
    window: PT15M
    # Cabecera con la IP real del visitante, solo si un proxy de confianza la sobrescribe siempre (ver docs/investigacion.md, S-10).
    client-ip-header: ${CLIENT_IP_HEADER:}
